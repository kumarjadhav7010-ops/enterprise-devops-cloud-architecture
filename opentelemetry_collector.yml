---
# Ansible Tasks for OpenTelemetry (OTel) Collector DaemonSet & Distributed Tracing

- name: Ensure OpenTelemetry Monitoring Namespace Exists
  kubernetes.core.k8s:
    name: opentelemetry
    api_version: v1
    kind: Namespace
    state: present

- name: Deploy OpenTelemetry Collector Configuration Map
  kubernetes.core.k8s:
    state: present
    namespace: opentelemetry
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: otel-collector-config
      data:
        otel-collector-config.yaml: |
          receivers:
            otlp:
              protocols:
                grpc:
                  endpoint: 0.0.0.0:4317
                http:
                  endpoint: 0.0.0.0:4318
            prometheus:
              config:
                scrape_configs:
                  - job_name: 'otel-collector'
                    scrape_interval: 15s
                    static_configs:
                      - targets: ['0.0.0.0:8888']

          processors:
            batch:
              timeout: 1s
              send_batch_size: 256
            memory_limiter:
              check_interval: 1s
              limit_percentage: 75
              spike_limit_percentage: 20
            redaction:
              allow_all_keys: false
              allowed_keys:
                - "http.status_code"
                - "http.method"
                - "http.route"
                - "service.name"
              blocked_values:
                - "(?i)password"
                - "(?i)bearer\\s+[a-zA-Z0-9_\\-\\.]+"
                - "(?i)api[_-]?key"

          exporters:
            otlp/tempo:
              endpoint: tempo.monitoring.svc.cluster.local:4317
              tls:
                insecure: true
            awsxray:
              region: ap-south-1
            logging:
              loglevel: warn

          service:
            pipelines:
              traces:
                receivers: [otlp]
                processors: [memory_limiter, redaction, batch]
                exporters: [otlp/tempo, awsxray]
              metrics:
                receivers: [otlp, prometheus]
                processors: [memory_limiter, batch]
                exporters: [logging]
            telemetry:
              logs:
                level: info

- name: Deploy OpenTelemetry Collector DaemonSet
  kubernetes.core.k8s:
    state: present
    namespace: opentelemetry
    definition:
      apiVersion: apps/v1
      kind: DaemonSet
      metadata:
        name: otel-collector
        labels:
          app.kubernetes.io/name: otel-collector
      spec:
        selector:
          matchLabels:
            app.kubernetes.io/name: otel-collector
        template:
          metadata:
            labels:
              app.kubernetes.io/name: otel-collector
          spec:
            containers:
              - name: otel-collector
                image: otel/opentelemetry-collector-contrib:0.98.0
                resources:
                  limits:
                    cpu: 500m
                    memory: 512Mi
                  requests:
                    cpu: 100m
                    memory: 128Mi
                ports:
                  - containerPort: 4317
                    hostPort: 4317
                    name: otlp-grpc
                  - containerPort: 4318
                    hostPort: 4318
                    name: otlp-http
                volumeMounts:
                  - name: config
                    mountPath: /etc/otelcol-contrib
            volumes:
              - name: config
                configMap:
                  name: otel-collector-config
