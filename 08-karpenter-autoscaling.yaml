apiVersion: karpenter.sh/v1beta1
kind: NodePool
metadata:
  name: enterprise-workloads-nodepool
  namespace: production-apps
spec:
  template:
    spec:
      nodeClassRef:
        name: enterprise-ec2-nodeclass
      requirements:
        - key: "karpenter.k8s.aws/instance-category"
          operator: In
          values: ["c", "m", "r", "g"]
        - key: "karpenter.k8s.aws/instance-generation"
          operator: Gt
          values: ["5"]
        - key: "karpenter.sh/capacity-type"
          operator: In
          values: ["spot", "on-demand"]
        - key: "kubernetes.io/arch"
          operator: In
          values: ["arm64", "amd64"]
  limits:
    cpu: "500"
    memory: "1000Gi"
  disruption:
    consolidationPolicy: WhenUnderutilized
    expireAfter: 720h
---
apiVersion: karpenter.k8s.aws/v1beta1
kind: EC2NodeClass
metadata:
  name: enterprise-ec2-nodeclass
spec:
  amiFamily: AL2
  role: "KarpenterNodeRole-enterprise-prod"
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "enterprise-production-eks"
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "enterprise-production-eks"
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 100Gi
        volumeType: gp3
        iops: 3000
        throughput: 125
        encrypted: true
