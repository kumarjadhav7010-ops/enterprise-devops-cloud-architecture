apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: enterprise-api-rollout
  namespace: production-apps
  labels:
    app.kubernetes.io/name: enterprise-api
spec:
  replicas: 10
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: enterprise-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: enterprise-api
    spec:
      containers:
        - name: api-server
          image: 123456789012.dkr.ecr.ap-south-1.amazonaws.com/enterprise-api:v2.4.0
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /health/
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
  strategy:
    canary:
      canaryService: enterprise-api-canary-svc
      stableService: enterprise-api-stable-svc
      trafficRouting:
        alb:
          ingress: enterprise-api-alb-ingress
          servicePort: 8000
      analysis:
        templates:
          - templateName: success-rate-analysis
        args:
          - name: service-name
            value: enterprise-api-canary-svc
      steps:
        - setWeight: 10
        - pause: { duration: 5m }
        - setWeight: 25
        - pause: { duration: 10m }
        - setWeight: 50
        - pause: { duration: 15m }
        - setWeight: 100
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: success-rate-analysis
  namespace: production-apps
spec:
  args:
    - name: service-name
  metrics:
    - name: success-rate
      interval: 1m
      successCondition: result[0] >= 0.995
      failureLimit: 3
      provider:
        prometheus:
          address: http://prometheus-k8s.monitoring.svc.cluster.local:9090
          query: |
            sum(rate(http_requests_total{service="{{args.service-name}}", status!~"5.*"}[2m]))
            /
            sum(rate(http_requests_total{service="{{args.service-name}}"}[2m]))
    - name: p99-latency
      interval: 1m
      successCondition: result[0] <= 0.250
      failureLimit: 3
      provider:
        prometheus:
          address: http://prometheus-k8s.monitoring.svc.cluster.local:9090
          query: |
            histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket{service="{{args.service-name}}"}[2m])) by (le))
