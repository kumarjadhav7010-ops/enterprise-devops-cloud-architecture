apiVersion: "serving.kserve.io/v1beta1"
kind: InferenceService
metadata:
  name: "enterprise-llm-vllm-service"
  namespace: "production-apps"
  annotations:
    serving.kserve.io/deploymentMode: "Serverless"
    serving.kserve.io/autoscalerClass: "kpa.autoscaling.knative.dev"
    autoscaling.knative.dev/metric: "concurrency"
    autoscaling.knative.dev/target: "30"
    autoscaling.knative.dev/min-scale: "1"
    autoscaling.knative.dev/max-scale: "8"
    autoscaling.knative.dev/scale-to-zero-pod-retention-period: "10m"
spec:
  predictor:
    timeout: 120
    model:
      modelFormat:
        name: vLLM
      storageUri: "s3://enterprise-model-weights-prod/mistral-7b-instruct-v0.3/"
      resources:
        limits:
          cpu: "8"
          memory: "32Gi"
          nvidia.com/gpu: "1"
        requests:
          cpu: "4"
          memory: "16Gi"
          nvidia.com/gpu: "1"
      args:
        - "--model"
        - "/mnt/models"
        - "--port"
        - "8080"
        - "--max-model-len"
        - "8192"
        - "--gpu-memory-utilization"
        - "0.92"
        - "--tensor-parallel-size"
        - "1"
        - "--enforce-eager"
        - "--disable-log-requests"
      env:
        - name: HUGGING_FACE_HUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: api-keys
              key: HF_API_TOKEN
      readinessProbe:
        httpGet:
          path: /health
          port: 8080
        initialDelaySeconds: 60
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 5
      livenessProbe:
        httpGet:
          path: /health
          port: 8080
        initialDelaySeconds: 90
        periodSeconds: 15
        timeoutSeconds: 5
---
apiVersion: "serving.kserve.io/v1alpha1"
kind: TrainedModel
metadata:
  name: "enterprise-lora-adapter-finance"
  namespace: "production-apps"
spec:
  inferenceService: "enterprise-llm-vllm-service"
  modelFramework: "vLLM"
  storageUri: "s3://enterprise-model-weights-prod/lora-adapters/finance-v1/"
  memory: "2Gi"
