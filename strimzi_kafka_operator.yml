---
# Ansible Tasks for Strimzi Kafka Operator & KRaft Cluster Deployment on Kubernetes

- name: Ensure Strimzi Kafka Namespace Exists
  kubernetes.core.k8s:
    name: kafka
    api_version: v1
    kind: Namespace
    state: present

- name: Deploy Strimzi Kafka Operator ClusterRole and Deployments
  kubernetes.core.k8s:
    src: "https://strimzi.io/install/latest?namespace=kafka"
    state: present
    namespace: kafka

- name: Deploy Production Kafka Cluster with KRaft Metadata Mode
  kubernetes.core.k8s:
    state: present
    namespace: kafka
    definition:
      apiVersion: kafka.strimzi.io/v1beta2
      kind: KafkaNodePool
      metadata:
        name: enterprise-dual-role
        labels:
          strimzi.io/cluster: enterprise-kafka-cluster
      spec:
        roles:
          - controller
          - broker
        replicas: 3
        storage:
          type: jbod
          volumes:
            - id: 0
              type: persistent-claim
              size: 250Gi
              class: gp3
              deleteClaim: false
        resources:
          requests:
            memory: 4Gi
            cpu: 2000m
          limits:
            memory: 8Gi
            cpu: 4000m
  register: nodepool_result

- name: Deploy Kafka Cluster CR with TLS & SCRAM Authentication
  kubernetes.core.k8s:
    state: present
    namespace: kafka
    definition:
      apiVersion: kafka.strimzi.io/v1beta2
      kind: Kafka
      metadata:
        name: enterprise-kafka-cluster
        annotations:
          strimzi.io/node-pools: enabled
          strimzi.io/kraft: enabled
      spec:
        kafka:
          version: 3.7.0
          listeners:
            - name: plain
              port: 9092
              type: internal
              tls: false
            - name: tls
              port: 9093
              type: internal
              tls: true
              authentication:
                type: scram-sha-512
          config:
            offsets.topic.replication.factor: 3
            transaction.state.log.replication.factor: 3
            transaction.state.log.min.isr: 2
            default.replication.factor: 3
            min.insync.replicas: 2
          metricsConfig:
            type: jmxPrometheusExporter
            valueFrom:
              configMapKeyRef:
                name: kafka-metrics
                key: kafka-metrics-config.json
        entityOperator:
          topicOperator: {}
          userOperator: {}
